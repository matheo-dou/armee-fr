<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Connaissances Militaires</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231b365d'%3E%3Cpath d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6l2 4 4.5.5-3.5 3 1 4.5-4-2.5-4 2.5 1-4.5-3.5-3 4.5-.5 2-4z'/%3E%3C/svg%3E">

    <style>
        :root {
            --primary: #1b365d;
            --background: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --accent: #2c5282;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 900px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
        }
        h1 { margin: 0; color: var(--primary); font-size: 24px; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
            min-width: 200px;
            outline: none;
        }
        select:focus {
            border-color: var(--primary);
        }
        #articles-container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            gap: 20px;
        }
        .article-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
            transition: transform 0.2s;
        }
        .article-card:hover {
            transform: translateY(-2px);
        }
        .article-card h2 { margin-top: 0; color: var(--primary); font-size: 20px; }
        .meta { font-size: 0.85em; color: #666; margin-bottom: 15px; }
        .category-tag {
            display: inline-block;
            background: #ebf8ff;
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .content {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .content.is-collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .toggle-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 14px;
            font-size: 0.85em;
            font-weight: bold;
            color: var(--accent);
            background: #ebf8ff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .toggle-btn:hover {
            background: #d6ecfb;
        }
        .grades-wrapper.is-hidden {
            display: none;
        }
        .grades-section-title {
            margin: 22px 0 10px 0;
            font-size: 15px;
            font-weight: bold;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .grades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 10px;
        }
        .grade-card {
            background: var(--background);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .grade-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            background: #ddd;
        }
        .grade-card h3 {
            margin: 0 0 6px 0;
            font-size: 15px;
            color: var(--primary);
        }
        .grade-card p {
            margin: 0;
            font-size: 0.85em;
            line-height: 1.5;
            color: #555;
        }
        .grade-card .credit {
            display: block;
            margin-top: 8px;
            font-size: 0.75em;
            color: #999;
        }
        .loader { text-align: center; font-size: 18px; color: #666; padding: 40px 0; }
        .error-msg { color: #c53030; background: #fff5f5; border: 1px solid #fed7d7; padding: 15px; border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>📖 Base de Connaissances</h1>
        <div class="controls">
            <!-- Menu déroulant dynamique -->
            <select id="category-select">
                <option value="Tout">🌍 Tout (Toutes les parties)</option>
            </select>
        </div>
    </header>

    <div id="articles-container">
        <div class="loader">Initialisation et lecture du dépôt...</div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION : REMPLACEZ PAR VOS INFOS
        // ==========================================
        const GITHUB_USER = "matheo-dou";
        const REPO_NAME = "armee-fr";
        const BRANCH = "main";

        // Dossier racine (dans le repo) contenant les fichiers JSON
        const ROOT_FOLDER = "json";

        // API GitHub : sert UNIQUEMENT à découvrir la liste des fichiers.
        // Le résultat est mis en cache dans le navigateur (voir CACHE_DURATION_MS) pour éviter
        // de rappeler l'API à chaque chargement de page.
        const GITHUB_API_BASE = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents`;

        // CDN jsDelivr : sert le contenu brut des fichiers, rapide et sans limite gênante
        const JSDELIVR_CDN_BASE = `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${REPO_NAME}@${BRANCH}`;

        // Durée de vie du cache de structure (liste des dossiers/fichiers), en millisecondes.
        // 10 minutes par défaut : un bon compromis entre fraîcheur et économie d'appels API.
        const CACHE_DURATION_MS = 10 * 60 * 1000;
        const CACHE_KEY = `armee-fr-structure-cache:${GITHUB_USER}/${REPO_NAME}@${BRANCH}`;

        let allArticles = []; // Contiendra la totalité des fichiers JSON chargés

        // Lancement de l'application
        init();

        // Lit la structure en cache si elle existe et n'est pas expirée. Retourne null sinon.
        function readStructureCache() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                const cached = JSON.parse(raw);
                if (Date.now() - cached.timestamp > CACHE_DURATION_MS) return null; // expiré
                return cached.structure;
            } catch (e) {
                // localStorage indisponible (ex : aperçu en bac à sable) -> on ignore simplement le cache
                return null;
            }
        }

        function writeStructureCache(structure) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), structure }));
            } catch (e) {
                // Échec silencieux si localStorage est indisponible ou plein : pas bloquant
            }
        }

        async function init() {
            try {
                // 1. On tente d'abord de lire la structure (dossiers + fichiers) depuis le cache local
                //    (sauf si l'utilisateur force un rafraîchissement via ?refresh dans l'URL)
                const forceRefresh = new URLSearchParams(window.location.search).has('refresh');
                let structure = forceRefresh ? null : readStructureCache();

                if (!structure) {
                    // Cache absent ou expiré -> on interroge l'API GitHub (une seule fois par dossier)
                    structure = await fetchStructureFromGitHub();
                    writeStructureCache(structure);
                }

                // 2. Construction du menu déroulant + chargement du contenu de chaque fichier via jsDelivr
                const selectEl = document.getElementById('category-select');
                const fetchPromises = [];

                for (const category of Object.keys(structure)) {
                    if (category !== "Racine") {
                        const option = document.createElement('option');
                        option.value = category;
                        option.textContent = category;
                        selectEl.appendChild(option);
                    }
                    for (const filePath of structure[category]) {
                        const fileUrl = `${JSDELIVR_CDN_BASE}/${filePath}`;
                        fetchPromises.push(loadJsonFile(fileUrl, category));
                    }
                }

                // 3. Attente du chargement complet de tous les fichiers
                await Promise.all(fetchPromises);

                // Activation de l'écouteur de changement sur le menu déroulant
                selectEl.addEventListener('change', filterArticles);

                // Premier affichage : option "Tout" par défaut
                renderArticles(allArticles);

            } catch (error) {
                document.getElementById('articles-container').innerHTML = `
                    <div class="error-msg">
                        <strong>Erreur d'initialisation :</strong> ${escapeHtml(error.message)}<br><br>
                        <em>Aide : Assurez-vous d'avoir rempli vos variables GITHUB_USER, REPO_NAME et BRANCH correctement, et que le dépôt est public.</em>
                    </div>`;
            }
        }

        // Interroge l'API GitHub pour construire la structure { categorie: [chemins de fichiers .json] }
        async function fetchStructureFromGitHub() {
            const response = await fetch(`${GITHUB_API_BASE}/${ROOT_FOLDER}?ref=${BRANCH}`);
            if (response.status === 403) {
                throw new Error("Limite de requêtes de l'API GitHub atteinte (60/heure sans authentification). Réessayez plus tard.");
            }
            if (!response.ok) {
                throw new Error(`Impossible d'accéder au dossier "${ROOT_FOLDER}" (code ${response.status}). Vérifiez GITHUB_USER, REPO_NAME, BRANCH et que le dépôt est public.`);
            }
            const items = await response.json();

            const structure = {};
            const scanPromises = [];

            for (const item of items) {
                if (item.type === "dir") {
                    scanPromises.push(
                        fetchFolderFiles(item.path).then(paths => {
                            structure[item.name] = paths;
                        })
                    );
                } else if (item.type === "file" && item.name.endsWith('.json')) {
                    if (!structure["Racine"]) structure["Racine"] = [];
                    structure["Racine"].push(item.path);
                }
            }

            await Promise.all(scanPromises);
            return structure;
        }

        // Liste les fichiers .json d'un sous-dossier via l'API GitHub, renvoie leurs chemins
        async function fetchFolderFiles(path) {
            try {
                const response = await fetch(`${GITHUB_API_BASE}/${path}?ref=${BRANCH}`);
                if (!response.ok) return [];
                const files = await response.json();
                return files
                    .filter(f => f.type === "file" && f.name.endsWith('.json'))
                    .map(f => f.path);
            } catch (e) {
                console.error(`Erreur lors du scan du dossier ${path}:`, e);
                return [];
            }
        }

        // Télécharger le JSON brut d'un fichier (via le CDN jsDelivr) et l'ajouter au tableau global
        async function loadJsonFile(fileUrl, category) {
            try {
                const response = await fetch(fileUrl);
                if (!response.ok) {
                    console.error("Fichier introuvable sur le CDN : " + fileUrl + " (code " + response.status + ")");
                    return;
                }
                const data = await response.json();

                // On associe dynamiquement le nom du dossier d'origine à l'article pour le filtrage
                data.categorie = category;
                allArticles.push(data);
            } catch (e) {
                console.error("Erreur de décodage du fichier JSON : " + fileUrl, e);
            }
        }

        // Échapper les caractères HTML pour éviter les injections / affichages cassés
        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Générer le code HTML des articles à l'écran
        function renderArticles(articles) {
            const container = document.getElementById('articles-container');

            if (articles.length === 0) {
                container.innerHTML = '<div class="loader">Aucun article trouvé dans cette sélection.</div>';
                return;
            }

            // Tri optionnel des articles du plus récent au plus ancien si le champ date est présent
            const sortedArticles = [...articles].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

            // Seuil (en caractères) au-delà duquel on tronque le contenu par défaut
            const TRUNCATE_THRESHOLD = 220;

            container.innerHTML = sortedArticles.map((art, index) => {
                const contentText = escapeHtml(art.contenu) || "Contenu vide.";

                // Support optionnel d'une structure "categories" : { nomCategorie: [ {grade, description, image, credit}, ... ] }
                // Utilisée pour les fiches type "grades" avec une image par grade.
                const gradesHtml = art.categories ? renderGradeCategories(art.categories) : '';
                const hasGrades = gradesHtml.length > 0;

                // On replie par défaut si le texte est long OU s'il y a des grades à masquer
                const isLong = (art.contenu || '').length > TRUNCATE_THRESHOLD || hasGrades;

                const contentId = `content-${index}`;
                const gradesId = `grades-${index}`;
                const topBtnId = `btn-top-${index}`;
                const bottomBtnId = `btn-bottom-${index}`;

                return `
                <article class="article-card">
                    <h2>${escapeHtml(art.titre) || "Article sans titre"}</h2>
                    <div class="meta">
                        ${art.auteur ? `Par <strong>${escapeHtml(art.auteur)}</strong>` : ''}
                        ${art.date ? `• Le ${formatDate(art.date)}` : ''}
                        <span class="category-tag">${escapeHtml(art.categorie === 'Racine' ? 'Général' : art.categorie)}</span>
                    </div>
                    <div class="content${isLong ? ' is-collapsed' : ''}" id="${contentId}">${contentText}</div>
                    ${hasGrades ? `<div class="grades-wrapper${isLong ? ' is-hidden' : ''}" id="${gradesId}">${gradesHtml}</div>` : ''}
                    ${isLong ? `<button class="toggle-btn" id="${topBtnId}" onclick="toggleContent('${index}')">Voir plus</button>` : ''}
                    ${isLong ? `<button class="toggle-btn" id="${bottomBtnId}" style="display:none" onclick="toggleContent('${index}')">Voir moins</button>` : ''}
                </article>
            `;
            }).join('');
        }

        // Formate le nom d'une clé de catégorie ("officiers_generaux" -> "Officiers Generaux")
        function formatCategoryLabel(key) {
            return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        // Génère le HTML d'une grille de grades (image + nom + description) à partir de la structure "categories"
        function renderGradeCategories(categories) {
            return Object.keys(categories).map(categoryKey => {
                const grades = categories[categoryKey];
                if (!Array.isArray(grades) || grades.length === 0) return '';

                const cardsHtml = grades.map(g => `
                    <div class="grade-card">
                        ${g.image ? `<img src="${escapeHtml(g.image)}" alt="${escapeHtml(g.grade)}" loading="lazy" onerror="this.style.display='none'">` : ''}
                        <h3>${escapeHtml(g.grade) || 'Grade'}</h3>
                        <p>${escapeHtml(g.description) || ''}</p>
                        ${g.credit ? `<span class="credit">© ${escapeHtml(g.credit)}</span>` : ''}
                    </div>
                `).join('');

                return `
                    <div class="grades-section-title">${escapeHtml(formatCategoryLabel(categoryKey))}</div>
                    <div class="grades-grid">${cardsHtml}</div>
                `;
            }).join('');
        }

        // Déplie / replie le contenu (texte + grades) d'un article, sans recharger la page.
        // Le bouton "Voir plus" (en haut, sous les métadonnées) et le bouton "Voir moins"
        // (en bas, après les grades) partagent le même état.
        function toggleContent(index) {
            const contentEl = document.getElementById(`content-${index}`);
            const gradesEl = document.getElementById(`grades-${index}`);
            const topBtn = document.getElementById(`btn-top-${index}`);
            const bottomBtn = document.getElementById(`btn-bottom-${index}`);
            if (!contentEl) return;

            const isNowCollapsed = contentEl.classList.toggle('is-collapsed');
            if (gradesEl) gradesEl.classList.toggle('is-hidden', isNowCollapsed);
            if (topBtn) topBtn.style.display = isNowCollapsed ? '' : 'none';
            if (bottomBtn) bottomBtn.style.display = isNowCollapsed ? 'none' : '';
        }

        // Filtrer les données en fonction du choix du menu déroulant
        function filterArticles(e) {
            const selected = e.target.value;
            if (selected === "Tout") {
                renderArticles(allArticles);
            } else {
                const filtered = allArticles.filter(art => art.categorie === selected);
                renderArticles(filtered);
            }
        }

        // Petite fonction utilitaire pour rendre la date plus lisible
        function formatDate(dateString) {
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return new Date(dateString).toLocaleDateString('fr-FR', options);
            } catch (e) {
                return dateString;
            }
        }
    </script>
</body>
</html>
