name: Purge jsDelivr Cache

# Se déclenche automatiquement à chaque push sur main, quel que soit le fichier modifié.
# Peut aussi être lancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt (avec historique pour comparer les commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Déterminer tous les fichiers modifiés/ajoutés/renommés
        id: changed_files
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            # Compare le commit précédent au commit actuel
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD)
          else
            # Premier commit du repo : on purge tout
            FILES=$(git ls-files)
          fi
          echo "Fichiers détectés :"
          echo "$FILES"
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Purger chaque fichier modifié sur le CDN jsDelivr
        if: steps.changed_files.outputs.files != ''
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          echo "${{ steps.changed_files.outputs.files }}" | while IFS= read -r file; do
            if [ -n "$file" ]; then
              # Encode les espaces éventuels dans le chemin du fichier
              ENCODED_FILE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$file")
              URL="https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/${ENCODED_FILE}"
              echo "Purge : $URL"
              curl -sS --retry 3 --retry-delay 2 "$URL" || echo "Échec de purge pour $file (ignoré)"
              sleep 1
            fi
          done

      - name: Purger la racine du dépôt (liste des fichiers)
        run: |
          # Aide data.jsdelivr.com à rafraîchir plus vite la liste des fichiers du repo.
          # Non garanti à 100% par la doc officielle, mais ne coûte rien d'essayer.
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          curl -sS --retry 3 --retry-delay 2 "https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/" || true
