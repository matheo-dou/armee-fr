<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Connaissances Militaires</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231b365d'%3E%3Cpath d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6l2 4 4.5.5-3.5 3 1 4.5-4-2.5-4 2.5 1-4.5-3.5-3 4.5-.5 2-4z'/%3E%3C/svg%3E">

    <style>
        :root {
            --primary: #1b365d;
            --background: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --accent: #2c5282;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 900px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
        }
        h1 { margin: 0; color: var(--primary); font-size: 24px; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
            min-width: 200px;
            outline: none;
        }
        select:focus {
            border-color: var(--primary);
        }
        #articles-container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            gap: 20px;
        }
        .article-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
            transition: transform 0.2s;
        }
        .article-card:hover {
            transform: translateY(-2px);
        }
        .article-card h2 { margin-top: 0; color: var(--primary); font-size: 20px; }
        .meta { font-size: 0.85em; margin-bottom: 10px; margin-top: -10px; }
        .category-tag {
            display: inline-block;
            background: #d9f2ff;
            color: var(--accent);
            padding: 2px 5px;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
        }
        .badge-sans-categorie {
            display: inline-block;
            background: #ffe6e6;
            color: #ff4d4d;
            padding: 2px 5px;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
        }
        .content {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .content.is-collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .toggle-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 14px;
            font-size: 0.85em;
            font-weight: bold;
            color: var(--accent);
            background: #ebf8ff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .toggle-btn:hover {
            background: #d6ecfb;
        }
        .grades-wrapper.is-hidden {
            display: none;
        }
        .grades-section-title {
            margin: 22px 0 10px 0;
            font-size: 15px;
            font-weight: bold;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .grades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 10px;
        }
        .grade-card {
            background: var(--background);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .grade-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            background: #ddd;
        }
        .grade-card h3 {
            margin: 0 0 6px 0;
            font-size: 15px;
            color: var(--primary);
        }
        .grade-card p {
            margin: 0;
            font-size: 0.85em;
            line-height: 1.5;
            color: #555;
        }
        .grade-card .credit {
            display: block;
            margin-top: 8px;
            font-size: 0.75em;
            color: #999;
        }
        .loader { text-align: center; font-size: 18px; padding: 40px 0; }
        .error-msg { color: #c53030; background: #fff5f5; border: 1px solid #fed7d7; padding: 15px; border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>📖 Base de Connaissances Militaires</h1>
        <div class="controls">
            <!-- Menu déroulant dynamique -->
            <select id="category-select">
                <option value="Tout">🌍 Tout (Toutes les parties)</option>
            </select>
        </div>
    </header>

    <div id="articles-container">
        <div class="loader">Initialisation et lecture du dépôt...</div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION : REMPLACEZ PAR VOS INFOS
        // ==========================================
        // ID du Google Sheet : dans l'URL docs.google.com/spreadsheets/d/CET_ID_LA/edit
        const SHEET_ID = "1yAZsph_IjBc5hCs3EGj0eb0_4Yo0OKoZiLLnRiVc3h8";
        // Onglet des articles : colonnes "id", "categorie" (identifiant), "contenu" (JSON)
        const SHEET_ARTICLES = "Articles";
        // Onglet des catégories : colonnes "id", "Nom Categorie"
        const SHEET_CATEGORIES = "Categories";

        let allArticles = []; // Contiendra la totalité des articles chargés

        // Lancement de l'application
        init();

        async function init() {
            try {
                const [articleRows, categoryRows] = await Promise.all([
                    fetchGvizRows(SHEET_ARTICLES, ['id', 'categorie', 'contenu']), 
                    fetchGvizRows(SHEET_CATEGORIES, ['id', 'Nom Categorie'])
                ]);
                
                if (articleRows.length === 0) {
                    throw new Error(`Aucune ligne trouvée dans l'onglet "${SHEET_ARTICLES}".`);
                }
                
                const categoryMap = {};
                const validCategories = [];

                // Nettoyage des espaces et vérification stricte
                categoryRows.forEach(row => {
                    if (row.id && row['Nom Categorie']) {
                        const nomPropre = row['Nom Categorie'].trim();
                        // Ignore la ligne si elle est vide ou ne contient que des espaces
                        if (nomPropre !== "") { 
                            categoryMap[row.id] = nomPropre;
                            validCategories.push({ id: row.id, name: nomPropre });
                        }
                    }
                });
                
                for (const row of articleRows) {
                    try {
                        const art = JSON.parse(row.contenu);
                        art.id = row.id;
                        art.categorieId = row.categorie ? row.categorie.toString().trim() : '';
                        
                        // Si l'ID existe et qu'il est dans la table, on met le nom, sinon "Sans Catégorie"
                        art.categorie = art.categorieId && categoryMap[art.categorieId]
                            ? categoryMap[art.categorieId]
                            : 'SANS CATEGORIE';
                            
                        allArticles.push(art);
                    } catch (e) {
                        console.error(`JSON invalide pour la ligne id="${row.id}" :`, e);
                    }
                }
                
                const selectEl = document.getElementById('category-select');
                
                validCategories
                    .sort((a, b) => a.name.localeCompare(b.name))
                    .forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat.id;
                        option.textContent = cat.name;
                        selectEl.appendChild(option);
                    });

                // Écouteur pour la mise à jour fluide de l'URL
                selectEl.addEventListener('change', (e) => {
                    const selectedVal = e.target.value;
                    const newUrl = new URL(window.location.href);
                    
                    if (selectedVal === 'Tout' || selectedVal === '') {
                        newUrl.searchParams.delete('cat');
                    } else {
                        newUrl.searchParams.set('cat', selectedVal);
                    }
                    
                    // Modifie l'URL sans recharger la page
                    window.history.pushState({}, '', newUrl); 
                    
                    filterArticles(e);
                });

                // Lecture de l'URL au chargement de la page
                const urlParams = new URLSearchParams(window.location.search);
                const catParam = urlParams.get('cat');
                
                if (catParam && categoryMap[catParam]) {
                    // Si l'URL a une catégorie valide existante
                    selectEl.value = catParam;
                } else {
                    // Si la catégorie n'existe pas ou qu'il n'y a pas de paramètre
                    selectEl.value = 'Tout';
                    
                    // Nettoie l'URL pour la remettre à zéro si le paramètre était invalide
                    if (catParam) {
                        const newUrl = new URL(window.location.href);
                        newUrl.searchParams.delete('cat');
                        window.history.replaceState({}, '', newUrl);
                    }
                }

                // Lancement de l'affichage initial en fonction de la sélection
                filterArticles({ target: selectEl });

            } catch (error) {
                document.getElementById('articles-container').innerHTML = `
                    <div class="error-msg">
                        <strong>Erreur d'initialisation :</strong> ${escapeHtml(error.message)}
                    </div>`;
            }
        }

        // Interroge un onglet du Google Sheet via l'API "gviz" (lecture publique, pas de clé nécessaire)
        // et renvoie ses lignes sous forme d'objets { nomColonne: valeur, ... }, en ne gardant que
        // les colonnes demandées dans requiredCols (comparaison insensible à la casse sur les en-têtes).
        async function fetchGvizRows(sheetName, requiredCols) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&headers=1`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Impossible d'accéder à l'onglet "${sheetName}" (code ${response.status}). Vérifiez SHEET_ID et les droits de partage.`);
            }
            const text = await response.text();

            // La réponse "gviz" est enveloppée dans un appel JS : google.visualization.Query.setResponse({...});
            const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
            if (!match) {
                throw new Error(`Réponse inattendue pour l'onglet "${sheetName}". Vérifiez que cet onglet existe bien.`);
            }
            const data = JSON.parse(match[1]);

            if (!data.table || !data.table.cols) {
                throw new Error(`Structure de réponse invalide pour l'onglet "${sheetName}".`);
            }

            const colLabels = data.table.cols.map(c => (c.label || '').trim().toLowerCase());
            const colIndexes = {};
            for (const col of requiredCols) {
                // Ajout de .toLowerCase() sur "col" pour comparer correctement
                const idx = colLabels.indexOf(col.toLowerCase());
                if (idx === -1) {
                    throw new Error(`Colonne "${col}" introuvable dans l'onglet "${sheetName}". Vérifiez les en-têtes de colonnes.`);
                }
                colIndexes[col] = idx;
            }

            return (data.table.rows || []).map(r => {
                const rowObj = {};
                for (const col of requiredCols) {
                    const cell = r.c[colIndexes[col]];
                    rowObj[col] = cell && cell.v !== null && cell.v !== undefined ? String(cell.v) : '';
                }
                return rowObj;
            }).filter(rowObj => rowObj.id); // on ignore les lignes vides (sans id)
        }

        // Échapper les caractères HTML pour éviter les injections / affichages cassés
        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Générer le code HTML des articles à l'écran
        function renderArticles(articles) {
            const container = document.getElementById('articles-container');

            if (articles.length === 0) {
                container.innerHTML = '<div class="loader">Aucun article trouvé dans cette sélection.</div>';
                return;
            }

            // Tri optionnel des articles du plus récent au plus ancien si le champ date est présent
            const sortedArticles = [...articles].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

            // Seuil (en caractères) au-delà duquel on tronque le contenu par défaut
            const TRUNCATE_THRESHOLD = 220;

            container.innerHTML = sortedArticles.map((art, index) => {
                const contentText = escapeHtml(art.contenu) || "Contenu vide.";

                // Support optionnel d'une structure "categories" : { nomCategorie: [ {grade, description, image, credit}, ... ] }
                // Utilisée pour les fiches type "grades" avec une image par grade.
                const gradesHtml = art.categories ? renderGradeCategories(art.categories) : '';
                const hasGrades = gradesHtml.length > 0;

                // On replie par défaut si le texte est long OU s'il y a des grades à masquer
                const isLong = (art.contenu || '').length > TRUNCATE_THRESHOLD || hasGrades;

                const contentId = `content-${index}`;
                const gradesId = `grades-${index}`;
                const topBtnId = `btn-top-${index}`;
                const bottomBtnId = `btn-bottom-${index}`;

                const categoryClass = art.categorie === 'SANS CATEGORIE' ? 'badge-sans-categorie' : 'category-tag';
                
                return `
                    <article class="article-card">
                        ${art.image ? `<img src="${escapeHtml(art.image)}" alt="${escapeHtml(art.titre)}" style="float: right; width: 300px; max-height: 200px; object-fit: contain; margin: 0px 0 15px 15px; border-radius: 8px;">` : ''}
                        <h2>${escapeHtml(art.titre) || "Article sans titre"}</h2>
                        <div class="meta">
                            ${art.auteur ? `Par <strong>${escapeHtml(art.auteur)}</strong>` : ''}
                            ${art.date ? `• Le ${formatDate(art.date)}` : ''}
                            <span class="${categoryClass}">${escapeHtml(art.categorie)}</span>
                        </div>
                        <div class="content${isLong ? ' is-collapsed' : ''}" id="${contentId}">${contentText}</div>
                        ${hasGrades ? `<div class="grades-wrapper${isLong ? ' is-hidden' : ''}" id="${gradesId}">${gradesHtml}</div>` : ''}
                        ${isLong ? `<button class="toggle-btn" id="${topBtnId}" onclick="toggleContent('${index}')">Voir plus</button>` : ''}
                        ${isLong ? `<button class="toggle-btn" id="${bottomBtnId}" style="display:none" onclick="toggleContent('${index}')">Voir moins</button>` : ''}
                    </article>
                    `;
            }).join('');
        }

        // Formate le nom d'une clé de catégorie ("officiers_generaux" -> "Officiers Generaux")
        function formatCategoryLabel(key) {
            return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        // Génère le HTML d'une grille de grades (image + nom + description) à partir de la structure "categories"
        function renderGradeCategories(categories) {
            return Object.keys(categories).map(categoryKey => {
                const grades = categories[categoryKey];
                if (!Array.isArray(grades) || grades.length === 0) return '';

                const cardsHtml = grades.map(g => `
                    <div class="grade-card">
                        ${g.image ?
                          `<div style="text-align: center; margin-top: 5px;">
                            <img src="${escapeHtml(g.image)}" alt="${escapeHtml(g.grade)}" style="width: 100%; height: 130px; object-fit: cover; border-radius: 6px;">
                            ${g.credit ? `<span style="font-size: 0.7em;">© ${escapeHtml(g.credit)}</span>` : ''}
                          </div>` : ''}
                        <h3>${escapeHtml(g.grade) || 'Grade'}</h3>
                        <p>${escapeHtml(g.description) || ''}</p>
                        ${g.credit ? `<span class="credit">© ${escapeHtml(g.credit)}</span>` : ''}
                    </div>
                `).join('');

                return `
                    <div class="grades-section-title">${escapeHtml(formatCategoryLabel(categoryKey))}</div>
                    <div class="grades-grid">${cardsHtml}</div>
                `;
            }).join('');
        }

        // Déplie / replie le contenu (texte + grades) d'un article, sans recharger la page.
        // Le bouton "Voir plus" (en haut, sous les métadonnées) et le bouton "Voir moins"
        // (en bas, après les grades) partagent le même état.
        function toggleContent(index) {
            const contentEl = document.getElementById(`content-${index}`);
            const gradesEl = document.getElementById(`grades-${index}`);
            const topBtn = document.getElementById(`btn-top-${index}`);
            const bottomBtn = document.getElementById(`btn-bottom-${index}`);
            if (!contentEl) return;

            const isNowCollapsed = contentEl.classList.toggle('is-collapsed');
            if (gradesEl) gradesEl.classList.toggle('is-hidden', isNowCollapsed);
            if (topBtn) topBtn.style.display = isNowCollapsed ? '' : 'none';
            if (bottomBtn) bottomBtn.style.display = isNowCollapsed ? 'none' : '';
        }

        // Filtrer les données en fonction du choix du menu déroulant (comparaison sur l'ID, stable
        // même si le nom de la catégorie est renommé plus tard dans l'onglet Categories)
        function filterArticles(e) {
            const selected = e.target.value;
            if (selected === "Tout") {
                renderArticles(allArticles);
            } else {
                const filtered = allArticles.filter(art => art.categorieId === selected);
                renderArticles(filtered);
            }
        }

        // Petite fonction utilitaire pour rendre la date plus lisible
        function formatDate(dateString) {
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return new Date(dateString).toLocaleDateString('fr-FR', options);
            } catch (e) {
                return dateString;
            }
        }
    </script>
</body>
</html>
