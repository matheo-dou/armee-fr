<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Connaissances Armée Française</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231b365d'%3E%3Cpath d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6l2 4 4.5.5-3.5 3 1 4.5-4-2.5-4 2.5 1-4.5-3.5-3 4.5-.5 2-4z'/%3E%3C/svg%3E">

    
    <style>
        :root {
            --primary: #1b365d;
            --background: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --accent: #2c5282;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 900px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
        }
        h1 { margin: 0; color: var(--primary); font-size: 24px; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
            min-width: 200px;
            outline: none;
        }
        select:focus {
            border-color: var(--primary);
        }
        #articles-container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            gap: 20px;
        }
        .article-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
            transition: transform 0.2s;
        }
        .article-card:hover {
            transform: translateY(-2px);
        }
        .article-card h2 { margin-top: 0; color: var(--primary); font-size: 20px; }
        .meta { font-size: 0.85em; color: #666; margin-bottom: 15px; }
        .category-tag {
            display: inline-block;
            background: #ebf8ff;
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .content {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .content.is-collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .toggle-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 14px;
            font-size: 0.85em;
            font-weight: bold;
            color: var(--accent);
            background: #ebf8ff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .toggle-btn:hover {
            background: #d6ecfb;
        }
        .loader { text-align: center; font-size: 18px; color: #666; padding: 40px 0; }
        .error-msg { color: #c53030; background: #fff5f5; border: 1px solid #fed7d7; padding: 15px; border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>Base de Connaissances Armée Française</h1>
        <div class="controls">
            <!-- Menu déroulant dynamique -->
            <select id="category-select">
                <option value="Tout">🌍 Tout (Toutes les parties)</option>
            </select>
        </div>
    </header>

    <div id="articles-container">
        <div class="loader">Initialisation et lecture du dépôt (via jsDelivr)...</div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION : REMPLACEZ PAR VOS INFOS
        // ==========================================
        const GITHUB_USER = "matheo-dou";
        const REPO_NAME = "armee-fr";
        const BRANCH = "main";

        // Dossier racine (dans le repo) contenant les fichiers JSON
        const ROOT_FOLDER = "json";

        // API jsDelivr : liste à plat de TOUS les fichiers du repo, en une seule requête
        const JSDELIVR_LIST_URL = `https://data.jsdelivr.com/v1/package/gh/${GITHUB_USER}/${REPO_NAME}@${BRANCH}/flat`;

        // CDN jsDelivr : sert le contenu brut des fichiers, sans limite de requêtes
        const JSDELIVR_CDN_BASE = `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${REPO_NAME}@${BRANCH}`;

        let allArticles = []; // Contiendra la totalité des fichiers JSON chargés

        // Lancement de l'application
        init();

        async function init() {
            try {
                // 1. Récupération de la liste complète des fichiers du repo via jsDelivr
                const response = await fetch(JSDELIVR_LIST_URL);
                if (!response.ok) {
                    throw new Error(`Impossible de lister les fichiers du dépôt (code ${response.status}). Vérifiez GITHUB_USER, REPO_NAME et BRANCH.`);
                }
                const data = await response.json();
                const allFiles = data.files || []; // ex: [{ name: "/json/Transmission/fiche1.json", ... }, ...]

                // 2. On ne garde que les fichiers .json situés dans le dossier ROOT_FOLDER
                const prefix = `/${ROOT_FOLDER}/`;
                const jsonFiles = allFiles.filter(f => f.name.startsWith(prefix) && f.name.endsWith('.json'));

                if (jsonFiles.length === 0) {
                    throw new Error(`Aucun fichier .json trouvé dans le dossier "${ROOT_FOLDER}/". Vérifiez le nom du dossier (ROOT_FOLDER) et que le repo est public.`);
                }

                // 3. Détermination de la catégorie (sous-dossier) de chaque fichier + remplissage du menu déroulant
                const categories = new Set();
                const selectEl = document.getElementById('category-select');
                const fetchPromises = [];

                for (const file of jsonFiles) {
                    // file.name ex: "/json/Transmission/fiche1.json" ou "/json/fiche.json"
                    const relativePath = file.name.slice(prefix.length); // "Transmission/fiche1.json" ou "fiche.json"
                    const parts = relativePath.split('/');
                    const category = parts.length > 1 ? parts[0] : "Racine";

                    if (!categories.has(category)) {
                        categories.add(category);
                        const option = document.createElement('option');
                        option.value = category;
                        option.textContent = category;
                        selectEl.appendChild(option);
                    }

                    const fileUrl = `${JSDELIVR_CDN_BASE}${file.name}`;
                    fetchPromises.push(loadJsonFile(fileUrl, category));
                }

                // 4. Attente du chargement complet de tous les fichiers
                await Promise.all(fetchPromises);

                // Activation de l'écouteur de changement sur le menu déroulant
                selectEl.addEventListener('change', filterArticles);

                // Premier affichage : option "Tout" par défaut
                renderArticles(allArticles);

            } catch (error) {
                document.getElementById('articles-container').innerHTML = `
                    <div class="error-msg">
                        <strong>Erreur d'initialisation :</strong> ${escapeHtml(error.message)}<br><br>
                        <em>Aide : Assurez-vous d'avoir rempli vos variables GITHUB_USER, REPO_NAME et BRANCH correctement, et que le dépôt est public.</em>
                    </div>`;
            }
        }

        // Télécharger le JSON brut d'un fichier (via le CDN jsDelivr) et l'ajouter au tableau global
        async function loadJsonFile(fileUrl, category) {
            try {
                const response = await fetch(fileUrl);
                if (!response.ok) return;
                const data = await response.json();

                // On associe dynamiquement le nom du dossier d'origine à l'article pour le filtrage
                data.categorie = category;
                allArticles.push(data);
            } catch (e) {
                console.error("Erreur de décodage du fichier JSON : " + fileUrl, e);
            }
        }

        // Échapper les caractères HTML pour éviter les injections / affichages cassés
        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Générer le code HTML des articles à l'écran
        function renderArticles(articles) {
            const container = document.getElementById('articles-container');

            if (articles.length === 0) {
                container.innerHTML = '<div class="loader">Aucun article trouvé dans cette sélection.</div>';
                return;
            }

            // Tri optionnel des articles du plus récent au plus ancien si le champ date est présent
            const sortedArticles = [...articles].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

            // Seuil (en caractères) au-delà duquel on tronque le contenu par défaut
            const TRUNCATE_THRESHOLD = 220;

            container.innerHTML = sortedArticles.map((art, index) => {
                const contentText = escapeHtml(art.contenu) || "Contenu vide.";
                const isLong = (art.contenu || '').length > TRUNCATE_THRESHOLD;
                const contentId = `content-${index}`;

                return `
                <article class="article-card">
                    <h2>${escapeHtml(art.titre) || "Article sans titre"}</h2>
                    <div class="meta">
                        ${art.auteur ? `Par <strong>${escapeHtml(art.auteur)}</strong>` : ''}
                        ${art.date ? `• Le ${formatDate(art.date)}` : ''}
                        <span class="category-tag">${escapeHtml(art.categorie === 'Racine' ? 'Général' : art.categorie)}</span>
                    </div>
                    <div class="content${isLong ? ' is-collapsed' : ''}" id="${contentId}">${contentText}</div>
                    ${isLong ? `<button class="toggle-btn" onclick="toggleContent('${contentId}', this)">Voir plus</button>` : ''}
                </article>
            `;
            }).join('');
        }

        // Déplie / replie le contenu complet d'un article, sans recharger la page
        function toggleContent(contentId, buttonEl) {
            const el = document.getElementById(contentId);
            if (!el) return;
            const isNowCollapsed = el.classList.toggle('is-collapsed');
            buttonEl.textContent = isNowCollapsed ? 'Voir plus' : 'Voir moins';
        }

        // Filtrer les données en fonction du choix du menu déroulant
        function filterArticles(e) {
            const selected = e.target.value;
            if (selected === "Tout") {
                renderArticles(allArticles);
            } else {
                const filtered = allArticles.filter(art => art.categorie === selected);
                renderArticles(filtered);
            }
        }

        // Petite fonction utilitaire pour rendre la date plus lisible
        function formatDate(dateString) {
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return new Date(dateString).toLocaleDateString('fr-FR', options);
            } catch (e) {
                return dateString;
            }
        }
    </script>
</body>
</html>
